<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Chat Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <style>
    #chatBox {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 5px;
      background-color: #f8f9fa;
    }

    .message {
      margin-bottom: 10px;
    }

    .user-message {
      text-align: right;
      color: #0d6efd;
    }

    .bot-message {
      text-align: left;
      color: #212529;
    }

    .typing-message {
      text-align: left;
      font-style: italic;
      color: #6c757d;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <!-- URL Form -->
    <div class="row justify-content-center mb-3">
      <div class="col-md-8">
        <form id="urlForm" class="d-flex">
          <input type="url" id="url" class="form-control me-2" placeholder="Enter website URL" required>
          <button type="submit" class="btn btn-primary">Start Chat</button>
        </form>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="row justify-content-center d-none" id="chatContainer">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title mb-3">Chat with Website Agent</h4>
            <div id="chatBox" class="mb-3"></div>

            <!-- Typing loader -->
            <div id="loader" class="typing-message d-none">Agent: Typing...</div>

            <form id="chatForm" class="d-flex mt-2">
              <input type="text" id="question" class="form-control me-2" placeholder="Type your message..." required>
              <button type="submit" class="btn btn-success">Send</button>
            </form>

            <div id="error" class="alert alert-danger mt-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  let websiteURL = "";

  // URL submission
  $('#urlForm').on('submit', function(e) {
    e.preventDefault();
    websiteURL = $('#url').val();
    if (websiteURL) {
      $.ajax({
      type: 'POST',
      url: '/process_url',
      headers: {
        'Authorization': 'Bearer get_my_key'  // Replace with your actual key
      },
      contentType: 'application/json',
      data: JSON.stringify({ url: websiteURL}),
      success: function(response) {
          console.log(response)
      },
      error: function(xhr) {

      },
      complete: function() {
        $('#chatContainer').removeClass('d-none');
        $('#chatBox').html('');
        $('#urlForm').find('input, button').prop('disabled', true);
      }
    });

    }
  });

  // Chat submission
  $('#chatForm').on('submit', function(e) {
    e.preventDefault();
    const question = $('#question').val().trim();
    if (!question) return;

    $('#error').addClass('d-none').html('');

    // Append user message
    $('#chatBox').append(`<div class="message user-message"><strong>You:</strong> ${question}</div>`);
    $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);
    $('#question').val('');

    // Show typing loader
    $('#loader').removeClass('d-none');
    $('#chatForm input, #chatForm button').prop('disabled', true);

    // AJAX to backend
    $.ajax({
      type: 'POST',
      url: '/chatbot_question/',
      headers: {
        'Authorization': 'Bearer get_my_key'  // Replace with your actual key
      },
      contentType: 'application/json',
      data: JSON.stringify({ url: websiteURL, question: question }),
      success: function(response) {
        let answerFormatted = typeof response.answer === 'object'
          ? `<pre><code>${JSON.stringify(response.answer, null, 2)}</code></pre>`
          : response.answer;

        $('#loader').addClass('d-none');
        $('#chatBox').append(`<div class="message bot-message"><strong>Agent:</strong> ${answerFormatted}</div>`);
        $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);
      },
      error: function(xhr) {
        const errorMsg = xhr.responseJSON?.detail || 'Something went wrong!';
        $('#error').removeClass('d-none').text(errorMsg);
        $('#loader').addClass('d-none');
      },
      complete: function() {
        $('#chatForm input, #chatForm button').prop('disabled', false);
      }
    });
  });
</script>
</body>
</html>
