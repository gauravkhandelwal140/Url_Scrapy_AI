<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Chat Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #e3f0ff 0%, #f6fcff 100%);
      min-height: 100vh;
    }
    .chat-header {
      background: #0d6efd;
      color: #fff;
      border-radius: .5rem .5rem 0 0;
      padding: 1rem 1.5rem;
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #chatBox {
      max-height: 410px;
      overflow-y: auto;
      background: #f2f6f9;
      border: none;
      padding: 1rem;
      border-radius: 0 0 .5rem .5rem;
      margin-bottom: 0;
      box-shadow: none;
      font-size: 1rem;
    }
    .message {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }
    .user-message {
      align-items: flex-end;
      text-align: right;
    }
    .user-message .bubble {
      background: #0d6efd;
      color: #fff;
    }
    .bot-message .bubble, .typing-message .bubble {
      background: #e7f1fc;
      color: #212529;
    }
    .typing-message .bubble {
      font-style: italic;
      background: #fffbe8;
      color: #bfa43a;
      border: 1px dashed #ffd700;
    }
    .bubble {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 1rem;
      max-width: 80%;
      word-break: break-word;
      margin-top: 3px;
      font-size: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .bot-message {
      align-items: flex-start;
      text-align: left;
    }
    #chatForm input[type="text"] {
      border-radius: 1.5rem;
      background: #f8f9fa;
      border: 1px solid #ddd;
      font-size: 1rem;
      padding-left: 1rem;
    }
    #chatForm .btn-success {
      border-radius: 1.5rem;
      font-weight: 500;
      padding: 0.375rem 1.5rem;
      letter-spacing: .02em;
    }
    #urlForm input[type="url"] {
      border-radius: 2rem;
      background: #f8f9fa;
      border: 1px solid #acd2fb;
      font-size: 1rem;
      padding-left: 1rem;
    }
    #urlForm .btn-primary[disabled] {
      background: #b1cae7 !important;
      border: none;
    }
    #loader {
      margin-bottom: 8px;
      font-size: .97em;
    }
    .fade-in-bottom {
      animation: fadeInUp 0.45s cubic-bezier(.24,1.61,.58,.89);
    }
    @keyframes fadeInUp {
      from { opacity:0; transform: translateY(30px);}
      to { opacity:1; transform: translateY(0);}
    }
    .card {
      border: none;
      border-radius: .75rem;
      box-shadow: 0 5px 25px 0 rgba(90,125,188,0.10);
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <!-- Website URL Input -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-8 col-lg-7">
        <form id="urlForm" class="d-flex shadow-sm p-2 rounded-3 bg-white gap-2">
          <input type="url" id="url" class="form-control" placeholder="🔗 Enter website URL (e.g. https://...)" required>
          <button type="submit" class="btn btn-primary px-4">Start Chat</button>
        </form>
      </div>
    </div>

    <!-- Chat Card Section -->
    <div class="row justify-content-center d-none" id="chatContainer">
      <div class="col-md-8 col-lg-7">
        <div class="card shadow fade-in-bottom">
          <div class="chat-header">
            <span>💬 Chat with Website Agent</span>
          </div>
          <div class="card-body p-0">
            <div id="chatBox" class="mb-0"></div>
            <div id="loader" class="message typing-message d-none"><span class="bubble">Agent: Typing...</span></div>
            <form id="chatForm" class="d-flex gap-2 p-3 pt-2 bg-white border-top" autocomplete="off">
              <input type="text" id="question" class="form-control" placeholder="Type your message..." required autocomplete="off">
              <button type="submit" class="btn btn-success px-4">Send</button>
            </form>
            <div id="error" class="alert alert-danger m-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  let websiteURL = "";

  // URL submission
  $('#urlForm').on('submit', function(e) {
    e.preventDefault();
    websiteURL = $('#url').val();
    if (websiteURL) {
      $.ajax({
        type: 'POST',
        url: '/process_url',
        headers: {
          'Authorization': 'Bearer get_my_key'
        },
        contentType: 'application/json',
        data: JSON.stringify({ url: websiteURL}),
        success: function(response) {
          // Optionally show a welcome message, etc
        },
        error: function(xhr) {
          $('#error').removeClass('d-none').text('Failed to connect. Please check the URL and try again.');
        },
        complete: function() {
          $('#chatContainer').removeClass('d-none');
          $('#chatBox').html('');
          $('#urlForm').find('input, button').prop('disabled', true);
        }
      });
    }
  });

  // Chat submission
  $('#chatForm').on('submit', function(e) {
    e.preventDefault();
    const question = $('#question').val().trim();
    if (!question) return;

    $('#error').addClass('d-none').html('');
    $('#chatBox').append(`
      <div class="message user-message fade-in-bottom">
        <span class="bubble"><strong>You:</strong> ${$('<div>').text(question).html()}</span>
      </div>
    `);
    $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);
    $('#question').val('');
    $('#loader').removeClass('d-none');
    $('#chatForm input, #chatForm button').prop('disabled', true);

    $.ajax({
      type: 'POST',
      url: '/chatbot_question',
      headers: {
        'Authorization': 'Bearer get_my_key'
      },
      contentType: 'application/json',
      data: JSON.stringify({ url: websiteURL, question: question }),
      success: function(response) {
        let answerFormatted = typeof response.answer === 'object'
          ? `<pre><code>${JSON.stringify(response.answer, null, 2)}</code></pre>`
          : $('<div>').text(response.answer).html();

        $('#loader').addClass('d-none');
        $('#chatBox').append(`
          <div class="message bot-message fade-in-bottom">
            <span class="bubble"><strong>Agent:</strong> ${answerFormatted}</span>
          </div>
        `);
        $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);
      },
      error: function(xhr) {
        const errorMsg = xhr.responseJSON?.detail || 'Something went wrong!';
        $('#error').removeClass('d-none').text(errorMsg);
        $('#loader').addClass('d-none');
      },
      complete: function() {
        $('#chatForm input, #chatForm button').prop('disabled', false);
      }
    });
  });
</script>
</body>
</html>
